name: Dependency audit

# Checks the development dependencies against the PyPI advisory database.
# The calculators themselves have no dependencies.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements-dev.txt
