name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The reference Lua 5.1 compiler. Without it the build falls back to the
      # Lua 5.1 bundled with lupa, which is what the Windows job exercises.
      - name: Install luac5.1
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Build all sheets (Lua 5.1 syntax gate, pack, round-trip check)
        run: python scripts/build.py --zip

      - name: Built files match the sources
        run: python scripts/build.py --check

      - name: Sheet list is up to date
        run: python scripts/make_sheet_list.py --check

      - name: Tests
        run: python -m pytest

      - name: Upload built calculators
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: calculators
          path: dist/*.zip
          if-no-files-found: error
