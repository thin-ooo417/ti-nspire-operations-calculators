name: Release

# Pushing a tag such as v1.0.0 builds the sheets, runs the tests and attaches
# the zip of .tns files to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install luac5.1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tag must match the VERSION file
        shell: bash
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Build
        run: python scripts/build.py --zip

      - name: Tests
        run: python -m pytest

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/manifest.json --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed. Load one sheet on your handheld and confirm it renders before transferring the rest."
